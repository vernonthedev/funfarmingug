commit-msg:
    commands:
        commitlint:
            run: npx commitlint --edit {1}

pre-commit:
    parallel: true
    commands:
        lint-web:
            root: 'apps/web/'
            glob: '*.{ts,tsx}'
            run: npx eslint {staged_files}
        lint-checkback:
            root: 'apps/checkback/'
            glob: '*.{ts,tsx}'
            run: npx eslint {staged_files}
        lint-admin:
            root: 'apps/admin/'
            glob: '*.{ts,tsx,json}'
            run: npx biome lint --error-on-warnings {staged_files}
        format:
            glob: '*.{ts,tsx,json,yaml,yml,md}'
            run: npx prettier --write {staged_files}

pre-push:
    parallel: true
    commands:
        commitlint:
            run: npx commitlint --from HEAD~1 --to HEAD
        lint-web:
            root: 'apps/web/'
            glob: '*.{ts,tsx}'
            run: npx eslint {staged_files}
        lint-checkback:
            root: 'apps/checkback/'
            glob: '*.{ts,tsx}'
            run: npx eslint {staged_files}
        lint-admin:
            root: 'apps/admin/'
            glob: '*.{ts,tsx,json}'
            run: npx biome lint --error-on-warnings {staged_files}

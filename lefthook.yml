commit-msg:
    commands:
        commitlint:
            run: npx commitlint --edit {1}

pre-commit:
    parallel: true
    commands:
        lint:
            glob: '*.{ts,tsx}'
            run: npx cross-env NODE_OPTIONS="--max-old-space-size=8192" npx eslint {staged_files}
        format:
            glob: '*.{ts,tsx,json,yaml,yml,md}'
            run: npx prettier --write {staged_files}

pre-push:
    parallel: true
    commands:
        commitlint:
            run: npx commitlint --from HEAD~1 --to HEAD
        lint:
            glob: '*.{ts,tsx}'
            run: npx cross-env NODE_OPTIONS="--max-old-space-size=8192" npx eslint {staged_files}
